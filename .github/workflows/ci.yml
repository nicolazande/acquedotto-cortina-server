name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Test unitari: non toccano il database, sono la rete di sicurezza sul calcolo.
      - name: Test unitari
        run: npm test

      # Smoke test end-to-end su un MongoDB vuoto: verifica che il percorso
      # completo (login, liste, generazione fattura, cancellazione a cascata,
      # allegati) funzioni davvero.
      - name: Avvio server
        run: npm start &
        env:
          MONGODB_URI: mongodb://localhost:27017/acquedotto-ci
          JWT_SECRET: ci-secret
          PORT: 5000

      - name: Attesa server pronto
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/auth/health && exit 0
            sleep 2
          done
          echo "il server non risponde" >&2
          exit 1

      - name: Utente di prova
        run: |
          curl -fsS -X POST http://localhost:5000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-password-123"}'
        env:
          JWT_SECRET: ci-secret

      # La fatturazione richiede gli articoli ACQUA, ACQUAF, COND, CONDF e GG_DELAY.
      - name: Articoli obbligatori
        run: npm run seed:articoli
        env:
          MONGODB_URI: mongodb://localhost:27017/acquedotto-ci

      - name: Smoke test
        run: npm run test:smoke
        env:
          SMOKE_API_URL: http://localhost:5000
          SMOKE_USERNAME: ci-admin
          SMOKE_PASSWORD: ci-password-123

